<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Incluir aquí los meta de descripción del sitio, las palabras claves y los autores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Estilos de Bootstrap 5 -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-primary d-flex justify-content-center">
    <main class="bg-secondary px-5 py-4 m-3">
        <!-- Cabecera del Formulario de Inicio Sesión -->
        <div class="text-center">
            <h1>CVS</h1>
            <h2>Comenius Virtual School</h2>
        </div>
        <!-- Fin de la Cabecera del Formulario de Inicio Sesión -->
        <!-- Contenido del Formulario-->
        <form action="#" method="post">
            <!-- Campo de Correo Electrónico -->
            <div class="mb-3">
              <label class="form-label">Correo</label>
              <input type="email" class="form-control" name="#" id="correo" placeholder="ejemplo@mail.com">
            </div>
            <!-- Fin del Campo de Correo Electrónico -->
            <!-- Campo de la Contraseña -->
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" name="#" id="contrasena" placeholder="****************">
            </div>
            <!-- Fin del Campo de la Contraseña -->
            <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
            <!-- Enlace para recuperar el correo o contraseña olvidada -->
            <div class="py-3 text-center">
                <small><a href="#">¿Has olvidado tu correo y/o contraseña?</a></small>
            </div>
            <!-- Fin del Enlace para recuperar el correo o contraseña olvidada -->
        </form>
        <!-- Fin del Contenido del Formulario -->
    </main>
    <!-- Script de Bootstrap 5 -->
    <script src="js/bootstrap.min.js"></script>
</body>
</html>
