<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>¡Bienvenido!</title>
        <!-- Estilos propios -->
        <link rel="stylesheet" href="css/estilos.css">
        <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js">
</script> 
<!--Testeo de EMAILJS-->
<!-- <script type="text/javascript">
        (function(){

        })();

    </head>
    <body class="bg-primary d-flex justify-content-center aling-items-center h-100">
        <main class="bg-secondary p-3 rounded">
            <!-- Cabecera del Formulario de Inicio Sesión -->
            <div class="text-center mb-5">
                <h1>CVS</h1>
                <h2>Comenius Virtual School</h2>
            </div>
            <!-- Fin de la Cabecera del Formulario de Inicio Sesión -->
            <!-- Contenido del Formulario -->
            <form action="#" method="post" class="form-content">
                <!-- Campo de Correo Electrónico -->
                <div class="login">
                    <input type="email" class="form-control w-100" name="#" id="#">
                    <label for="#" class="form-label">Correo</label>
                </div>
                <!-- Fin del Campo de Correo Electrónico -->
                <!-- Campo de la Contraseña -->
                <div class="login">
                    <input type="password" class="form-control w-100" name="#" id="!#">
                    <label for="!#" class="form-label">Contraseña</label>
                </div>
                <!-- Fin del Campo de la Contraseña -->
                <div>
                    <input class="check" type="checkbox" name="###" id="###">
                    <label for="###">Recordar correo</label>
                </div>
                <div class="py-3 text-center">
                    <button type="submit" class="btn btn-primary w-100 text-white">Iniciar Sesión</button>
                </div>
                <!-- Enlace para recuperar el correo o contraseña olvidada -->
                <div class="mt-5 text-center">
                    <small>¿Has olvidado tu contraseña? <a href="#">Ingrese aquí</a></small>
                </div>
                <!-- Fin del Enlace para recuperar el correo o contraseña olvidada -->
            </form>
            <!-- Fin del Contenido del Formulario -->
        </main>
        <script src="js/jquery-3.5.1.min.js"></script>
        <script src="js/index.js"></script>
    </body>
</html>
