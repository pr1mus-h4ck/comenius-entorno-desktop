<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <!-- Incluir aquí los meta de descripción del sitio, las palabras claves y los autores -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>¡Bienvenido!</title>
        <!-- Estilos propios -->
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body class="bg-primary d-flex justify-content-center aling-items-center h-100">
        <main class="bg-secondary p-3">
            <!-- Cabecera del Formulario de Inicio Sesión -->
            <div class="text-center">
                <h1>CVS</h1>
                <h2>Comenius Virtual School</h2>
            </div>
            <!-- Fin de la Cabecera del Formulario de Inicio Sesión -->
            <!-- Contenido del Formulario-->
            <form action="#" method="post">
                <!-- Cabecera del Formulario de Inicio Sesión -->
                <div class="text-center">
                    <h1>C V S</h1>
                    <h2>Comenius Virtual School</h2>
                </div>
                <!-- Fin de la Cabecera del Formulario de Inicio Sesión -->
                <!-- Campo de Correo Electrónico -->
                <div class="mb-3">
                    <label for="#" class="form-label w-100">Correo</label>
                    <input type="email" class="form-control w-100" name="#" id="#" placeholder="ejemplo@mail.com">
                </div>
                <!-- Fin del Campo de Correo Electrónico -->
                <!-- Campo de la Contraseña -->
                <div class="mb-3">
                    <label for="#" class="form-label w-100">Contraseña</label>
                    <input type="password" class="form-control w-100" name="#" id="##" placeholder="****************">
                </div>
                <!-- Fin del Campo de la Contraseña -->
                <div class="py-3 text-center">
                    <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                </div>
                <!-- Enlace para recuperar el correo o contraseña olvidada -->
                <div class="py-3 text-center">
                    <small><a href="#">¿Has olvidado tu correo y/o contraseña?</a></small>
                </div>
                <!-- Fin del Enlace para recuperar el correo o contraseña olvidada -->
            </form>
            <!-- Fin del Contenido del Formulario -->
        </main>
    </body>
</html>
