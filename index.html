<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVS</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main>
        <div>
            <h1>Hola Mundo</h1>
        </div> 
        <!--DESDE ACÁ EL LOGIN-->
        <form action="#" method="post" id="formLogin"> 
            <!--casilla de email-->
            <div class="mb-3">
                <label for="correo" class="form-label">Email</label> 
                <input type="email" class="form-control" name="#" id="correo" aria-describedby="emailHelpId" placeholder="abc@mail.com" required>
                <small id="emailHelpId" class="form-text text-muted">Help text</small>
            </div>
            <!--casilla de contraseña-->
            <div class="mb-3">
                <label for="contrasena" class="form-label">Password</label>
                <input type="password" class="form-control" name="##" id="contrasena" placeholder="" required>
            </div>
            <!--TODO: COOKIE en el checkbox para recordar el inicio de sesión-->
            <div>
                <div class="form-check">
                    <label class="form-check-label" for="###">
                    <input class="form-check-input" type="checkbox" value="" id="###">
                        Recordar correo
                    </label>
                </div>
            </div>
            <div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        </form> 
        <!--ACÁ TERMINA EL LOGIN-->
    </main>
    <script src="js/index.js"></script>
</body>
</html>
